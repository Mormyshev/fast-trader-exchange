meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  env:
    NEXT_FONT_GOOGLE_MOCKED: "true"
  skip: false
  additionalCommands: npm install --include=dev && npm run build
  artifacts:
    "*": /
run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: npm run start
  persistenceMount: /data
  containerPort: "3000"
